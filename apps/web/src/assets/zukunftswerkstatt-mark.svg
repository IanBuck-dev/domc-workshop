<!-- Favicon. Zweite Fassung der Bildmarke aus components/brand-mark.tsx: das
     Favicon in index.html braucht eine Datei, currentColor gibt es hier nicht,
     deshalb der feste Wert der Variablen primary aus styles.css.
     tests/brand-mark.test.ts prüft beide gegeneinander — bei einer Änderung
     immer beide Dateien anfassen.

     Kein doppeltes Minus in diesem Kommentar: das ist in XML-Kommentaren
     verboten, die Datei wird sonst als fehlerhaft verworfen und der Browser
     zeigt gar kein Favicon mehr an. Deshalb CSS-Variablen hier ohne Praefix
     benennen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="9" fill="#14563c"/>
  <g transform="translate(7 7) scale(0.75)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <path d="M16 3.128a4 4 0 0 1 0 7.744"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
    <circle cx="9" cy="7" r="4"/>
  </g>
</svg>
